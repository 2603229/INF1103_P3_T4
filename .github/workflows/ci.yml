
name: INF1103 Team 4 CI Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: python -m pip install -r requirement.txt

      - name: Verify Python Syntax
        run: python -m compileall -q main.py IO_Manager.py ai_manager.py logic_manager.py Data_Manager.py management_ui.py test_script.py

      - name: Run Automated Tests
        run: python test_script.py

      - name: Build Docker Image
        run: docker build -t hazard-reporter .

      - name: Run Tests Inside Docker
        run: docker run --rm hazard-reporter python test_script.py